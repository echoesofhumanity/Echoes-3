<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Echoes of Humanity</title>

    <meta
        name="description"
        content="Echoes of Humanity — A global space for people, ideas, stories, knowledge and action."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">
        <div class="container header-inner">

            <a href="index.html" class="logo">
                <span data-content="site-name">Echoes of Humanity</span>
            </a>

            <nav class="main-nav" aria-label="Main navigation">

                <a href="about.html">About</a>
                <a href="humanitarian-action.html">Action</a>
                <a href="academy.html">Academy</a>
                <a href="media-archive.html">Media</a>
                <a href="global-network.html">Network</a>
                <a href="marketplace.html">Marketplace</a>
                <a href="contact.html">Contact</a>

            </nav>

        </div>
    </header>


    <main>

        <!-- =========================
             HERO
        ========================== -->

        <section class="hero" id="hero">

            <div class="hero-atmosphere" aria-hidden="true"></div>

            <div class="container hero-content">

                <p
                    class="hero-eyebrow"
                    data-content="hero.eyebrow">
                </p>

                <h1
                    class="hero-title"
                    data-content="hero.title">
                </h1>

                <p
                    class="hero-description"
                    data-content="hero.description">
                </p>

                <div class="hero-actions">

                    <a
                        href="#explore"
                        class="button button-primary"
                        data-content="hero.primaryButton">
                    </a>

                    <a
                        href="#join"
                        class="button button-secondary"
                        data-content="hero.secondaryButton">
                    </a>

                </div>

            </div>

        </section>


        <!-- =========================
             INTRODUCTION
        ========================== -->

        <section class="section introduction" id="explore">

            <div class="container">

                        <div class="section-heading">
            
            <p
                class="section-eyebrow"
                data-content="introduction.eyebrow">
            </p>

            <h2
                class="section-title"
                data-content="introduction.title">
            </h2>

            <p
                class="section-description"
                data-content="introduction.description">
            </p>

        </div>


        <div class="introduction-grid">

            <article class="introduction-card">
                <h3 data-content="introduction.cards.people.title"></h3>
                <p data-content="introduction.cards.people.description"></p>
            </article>

            <article class="introduction-card">
                <h3 data-content="introduction.cards.ideas.title"></h3>
                <p data-content="introduction.cards.ideas.description"></p>
            </article>

            <article class="introduction-card">
                <h3 data-content="introduction.cards.stories.title"></h3>
                <p data-content="introduction.cards.stories.description"></p>
            </article>

            <article class="introduction-card">
                <h3 data-content="introduction.cards.knowledge.title"></h3>
                <p data-content="introduction.cards.knowledge.description"></p>
            </article>

        </div>

            </div>

        </section>


        <!-- =========================
             FEATURED PROJECTS
        ========================== -->

        <section class="section featured-projects" id="projects">

            <div class="container">

                <div class="section-heading">

                    <p
                        class="section-eyebrow"
                        data-content="projects.eyebrow">
                    </p>

                    <h2
                        data-content="projects.title">
                    </h2>

                    <p
                        data-content="projects.description">
                    </p>

                </div>

                <div
                    class="content-grid"
                    data-content-list="projects.items">
                </div>

            </div>

        </section>


        <!-- =========================
             STORIES
        ========================== -->

        <section class="section stories" id="stories">

            <div class="container">

                <div class="section-heading">

                    <p
                        class="section-eyebrow"
                        data-content="stories.eyebrow">
                    </p>

                    <h2
                        data-content="stories.title">
                    </h2>

                    <p
                        data-content="stories.description">
                    </p>

                </div>

                <div
                    class="content-grid"
                    data-content-list="stories.items">
                </div>

            </div>

        </section>


        <!-- =========================
             HUMANITARIAN ACTION
        ========================== -->

        <section class="section action-section" id="action">

            <div class="container">

                <p
                    class="section-eyebrow"
                    data-content="action.eyebrow">
                </p>

                <h2
                    data-content="action.title">
                </h2>

                <p
                    data-content="action.description">
                </p>

                <div
                    class="content-grid"
                    data-content-list="action.items">
                </div>

            </div>

        </section>


        <!-- =========================
             JOIN THE MOVEMENT
        ========================== -->

        <section class="section join-section" id="join">

            <div class="container">

                <p
                    class="section-eyebrow"
                    data-content="join.eyebrow">
                </p>

                <h2
                    data-content="join.title">
                </h2>

                <p
                    data-content="join.description">
                </p>

                <a
                    href="contact.html"
                    class="button button-primary"
                    data-content="join.button">
                </a>

            </div>

        </section>

         FOOTER
    ========================== -->

    <footer class="site-footer">

        <div class="container">

            <div class="footer-brand">
                <span data-content="site-name">
                    Echoes of Humanity
                </span>
            </div>

            <nav class="footer-nav" aria-label="Footer navigation">

                <a href="about.html">About</a>
                <a href="vision.html">Vision</a>
                <a href="mission.html">Mission</a>
                <a href="manifesto.html">Manifesto</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>

            </nav>

            <p class="copyright">
                © 2026 Echoes of Humanity. All rights reserved.
            </p>

        </div>

    </footer>
